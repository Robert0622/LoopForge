name: platform-release

# Platform releases are tagged platform-v<semver>; plain v* tags belong to the
# CLI release workflow and its installer.
on:
  push:
    tags: ["platform-v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#platform-v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not platform-v<semver>" >&2
            exit 1
          fi
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/loopforge"
          tags="${image}:${version}"
          if [[ "${version}" != *-* ]]; then
            tags+=$'\n'"${image}:${version%.*}"
            tags+=$'\n'"${image}:latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test before publishing
        run: go vet ./... && go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            exit 0
          fi
          args=(--title "LoopForge Platform v${VERSION}" --generate-notes)
          previous="$(git tag --list 'platform-v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n1 || true)"
          if [[ -n "${previous}" ]]; then
            args+=(--notes-start-tag "${previous}")
          fi
          if [[ "${VERSION}" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          printf 'Container image: `%s:%s` (linux/amd64, linux/arm64)\n\n```bash\nLOOPFORGE_VERSION=%s docker compose up -d\n```\n' \
            "${IMAGE}" "${VERSION}" "${VERSION}" > notes.md
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" --notes-file notes.md
