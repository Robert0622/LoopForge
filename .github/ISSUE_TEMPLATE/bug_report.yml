name: Bug report
description: Report a reproducible LoopForge problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LoopForge. Remove credentials, private endpoints, internal logs, and personal data before submitting.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - LoopForge Platform (server, web studio, runner)
        - CodeBuddy
        - Codex
        - Cursor
        - Claude Code
        - Installer / CLI
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Classic
        - Portable
        - Not applicable (Platform)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LoopForge version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant `loopforge doctor` output and errors after removing sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private endpoints, internal identifiers, and personal data.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
